<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your bird - CCS26</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:-apple-system,"Avenir Next",Helvetica,Arial,sans-serif;background:#16261d;color:#e9efe6;
       display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  button{width:62vmin;height:62vmin;max-width:300px;max-height:300px;border-radius:50%;border:2px solid #9cc5a1;
         background:radial-gradient(circle,#2c4a37 0%,#1c3226 70%);color:#e9efe6;font-size:22px;line-height:1.3;cursor:pointer}
  button.on{animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(156,197,161,.45)}50%{box-shadow:0 0 0 22px rgba(156,197,161,0)}}
  h1{font-weight:400;font-size:26px;margin:28px 0 4px} .sci{font-style:italic;color:#9cb7a0;margin:0 0 18px}
  .hint{color:#b9cbb9;font-size:16px;max-width:320px;line-height:1.5}
  .credit{position:fixed;bottom:10px;left:12px;right:12px;font-size:11px;color:#7f9883} .credit a{color:#9cb7a0}
</style></head>
<body>
<button id="b">Tap to hear<br>your bird</button>
<h1 id="name" hidden>Song sparrow</h1>
<p class="sci" id="sci" hidden>Melospiza melodia</p>
<p class="hint" id="hint">Turn the volume up first.</p>
<audio id="a" src="../audio/5.mp3" loop preload="auto"></audio>
<p class="credit">Recording: Doug Hynes, xeno-canto XC570789, CC BY-SA 4.0, via <a href="https://commons.wikimedia.org/wiki/File:Melospiza_melodia_-_Song_Sparrow_XC570789.mp3">Wikimedia Commons</a> (trimmed, level-matched). Bird-forest idea after Marshmallow Laser Feast.</p>
<script>
const a = document.getElementById('a'), btn = document.getElementById('b');
let started = false;
btn.onclick = () => {
  if (a.paused) {
    if (!started && a.duration) a.currentTime = Math.random() * a.duration;   // phones start at different places
    a.play(); started = true; btn.classList.add('on'); btn.innerHTML = 'Your bird is singing<br><small>tap to pause</small>';
    document.getElementById('name').hidden = document.getElementById('sci').hidden = false;
    document.getElementById('hint').textContent = 'Phone face up on your lap. Close your eyes and listen to the room.';
  } else { a.pause(); btn.classList.remove('on'); btn.innerHTML = 'Tap to hear<br>your bird'; }
};
</script>
</body></html>

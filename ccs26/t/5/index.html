<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CCS26</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:-apple-system,"Avenir Next",Helvetica,Arial,sans-serif;background:#1c1f24;color:#eceef0;
       display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  button{width:62vmin;height:62vmin;max-width:300px;max-height:300px;border-radius:50%;border:2px solid #b8c2cc;
         background:radial-gradient(circle,#343a42 0%,#25292f 70%);color:#eceef0;font-size:22px;line-height:1.3;cursor:pointer}
  button.on{animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(184,194,204,.45)}50%{box-shadow:0 0 0 22px rgba(184,194,204,0)}}
  h1{font-weight:400;font-size:26px;margin:28px 0 4px} .sci{font-style:italic;color:#9cb7a0;margin:0 0 18px}
  .hint{color:#eceef0;font-size:20px;max-width:320px;line-height:1.5;margin:0 0 28px;min-height:60px}
  .credit{position:fixed;bottom:10px;left:12px;right:12px;font-size:11px;color:#8a939c} .credit a{color:#b8c2cc}
</style></head>
<body>
<p class="hint" id="hint">Volume all the way up,<br>then tap the circle.</p>
<button id="b">Tap</button>
<audio id="a" src="/ccs26/birds/audio/5.mp3" loop preload="auto"></audio>
<p class="credit" id="credit" hidden>Song sparrow - recording: Doug Hynes, xeno-canto XC570789, CC BY-SA 4.0, via <a href="https://commons.wikimedia.org/wiki/File:Melospiza_melodia_-_Song_Sparrow_XC570789.mp3">Wikimedia Commons</a> (trimmed, level-matched). After Marshmallow Laser Feast. <a href="/ccs26/birds/">All ten</a></p>
<script>
const a = document.getElementById('a'), btn = document.getElementById('b');
let started = false;
btn.onclick = () => {
  if (a.paused) {
    if (!started && a.duration) a.currentTime = Math.random() * a.duration;   // phones start at different places
    a.play(); started = true; btn.classList.add('on'); btn.textContent = 'Pause';
    document.getElementById('hint').textContent = ''; document.getElementById('credit').hidden = false;
  } else { a.pause(); btn.classList.remove('on'); btn.textContent = 'Tap'; }
};
</script>
</body></html>
